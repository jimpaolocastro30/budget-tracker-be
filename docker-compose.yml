services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/budget_tracker
      ENVIRONMENT: development
      DEBUG: "true"
      ENABLE_DOCS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["sh", "./scripts/entrypoint.sh"]

volumes:
  postgres_data:
